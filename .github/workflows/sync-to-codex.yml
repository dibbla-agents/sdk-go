name: Sync to Codex

on:
  push:
    branches:
      - main

env:
  SLACK_CHANNEL_ID: C09FCR96Q58
  TARGET_REPO: dibbla-agents/codex
  TARGET_DIR: workflows-sdk/go

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Initiate the sync sequence
        id: sync_sequence
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "🔄 Syncing `${{ github.repository }}` → `${{ env.TARGET_REPO }}` (branch: ${{ github.ref_name }})"
            attachments:
              - color: "dbab09"
                fields:
                  - title: "Status"
                    short: true
                    value: "In Progress"
                  - title: "Source Repository"
                    short: true
                    value: "${{ github.repository }}"
                  - title: "Target Repository"
                    short: true
                    value: "${{ env.TARGET_REPO }}"
                  - title: "Branch"
                    short: true
                    value: "${{ github.ref_name }}"
                  - title: "Commit"
                    short: true
                    value: "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - title: "Commit Message"
                    short: false
                    value: "${{ github.event.head_commit.message }}"
                  - title: "Author"
                    short: true
                    value: "${{ github.event.head_commit.author.name }}"
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target-repo

      - name: Move source repo into target
        run: |
          TARGET_DIR="target-repo/${{ env.TARGET_DIR }}"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cp -r source-repo/* "$TARGET_DIR"
          cp -r source-repo/.[^.]* "$TARGET_DIR" || true  # copy dotfiles except . and ..

      # 4. Commit only if there are changes
      - name: Commit only if changes
        run: |
          cd target-repo

          git config user.name "${{ github.event.head_commit.author.name }}"
          git config user.email "${{ github.event.head_commit.author.email }}"

          if ! git diff --quiet; then
            git add .
            git commit -m "${{ github.event.head_commit.message }}"
            git push origin main
          else
            echo "No changes detected, skipping commit"
          fi

      # ✅ Slack notification on success
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            ts: "${{ steps.sync_sequence.outputs.ts }}"
            text: "✅ Successfully synced `${{ github.repository }}` → `${{ env.TARGET_REPO }}`"
            attachments:
              - color: "28a745"
                fields:
                  - title: "Status"
                    short: true
                    value: "Completed"
                  - title: "Source Repository"
                    short: true
                    value: "${{ github.repository }}"
                  - title: "Target Repository"
                    short: true
                    value: "${{ env.TARGET_REPO }}"
                  - title: "Branch"
                    short: true
                    value: "${{ github.ref_name }}"
                  - title: "Commit"
                    short: true
                    value: "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - title: "Commit Message"
                    short: false
                    value: "${{ github.event.head_commit.message }}"
                  - title: "Author"
                    short: true
                    value: "${{ github.event.head_commit.author.name }}"

      # ❌ Slack notification on failure
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            ts: "${{ steps.sync_sequence.outputs.ts }}"
            text: "❌ Failed to sync `${{ github.repository }}` → `${{ env.TARGET_REPO }}`"
            attachments:
              - color: "dc3545"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failed"
                  - title: "Source Repository"
                    short: true
                    value: "${{ github.repository }}"
                  - title: "Target Repository"
                    short: true
                    value: "${{ env.TARGET_REPO }}"
                  - title: "Branch"
                    short: true
                    value: "${{ github.ref_name }}"
                  - title: "Commit"
                    short: true
                    value: "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - title: "Commit Message"
                    short: false
                    value: "${{ github.event.head_commit.message }}"
                  - title: "Author"
                    short: true
                    value: "${{ github.event.head_commit.author.name }}"
